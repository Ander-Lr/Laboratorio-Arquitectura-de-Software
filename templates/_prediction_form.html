{% if prediction_fields %}
<section class="wm-card" aria-labelledby="t-prediccion">
    <div class="wm-card-head">
        <h2 id="t-prediccion" class="h5 mb-0">
            <i class="bi bi-cloud-rain me-2" aria-hidden="true"></i>Probar una predicción
        </h2>
        <p class="mb-0 small wm-muted">Completa los mismos datos que el modelo recibió durante el entrenamiento.</p>
    </div>
    <div class="wm-card-body">
        <form action="{{ url_for('predict') }}" method="post"
            data-loading="Calculando predicción…" aria-describedby="prediction-help">
            <p id="prediction-help" class="small wm-muted mb-3">
                Los campos numéricos aceptan decimales. Los demás aceptan texto.
            </p>
            <div class="row g-3">
                {% for field in prediction_fields %}
                <div class="col-md-6">
                    <label class="form-label fw-semibold" for="prediction-{{ loop.index }}">{{ field.name }}</label>
                    <input class="form-control" id="prediction-{{ loop.index }}" name="{{ field.name }}"
                        type="{{ 'number' if field.numeric else 'text' }}"
                        {% if field.numeric %}step="any" inputmode="decimal"{% endif %}
                        value="{{ field.value }}" required />
                </div>
                {% endfor %}
            </div>
            <button class="btn btn-primary w-100 mt-4" type="submit">
                <i class="bi bi-magic me-1" aria-hidden="true"></i>Predecir lluvia
            </button>
            <p class="visually-hidden" data-loading-status aria-live="polite"></p>
        </form>
    </div>
</section>
{% endif %}
