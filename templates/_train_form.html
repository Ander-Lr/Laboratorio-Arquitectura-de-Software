{# Formulario de entrenamiento. Si "retrain" es verdadero, exige confirmar que se reemplaza el modelo actual. #}
<form action="{{ url_for('train') }}" method="post" enctype="multipart/form-data"
    data-loading="Entrenando modelo…"{% if retrain %} data-confirm{% endif %}>
    <label class="dropzone" id="dropzone" for="dataset">
        <i class="bi bi-file-earmark-spreadsheet dz-icon" id="dz-icon" aria-hidden="true"></i>
        <span class="dz-title" id="dz-title">Elige un archivo CSV o arrástralo aquí</span>
        <span class="dz-sub" id="dz-sub">Solo se aceptan archivos .csv</span>
        <input class="visually-hidden" id="dataset" type="file" name="dataset"
            accept=".csv,text/csv" required />
    </label>

    <p class="small wm-muted mt-3 mb-0">
        <i class="bi bi-info-circle me-1" aria-hidden="true"></i>
        El archivo necesita columnas con las características y una columna objetivo
        con al menos dos clases. Se recomienda llamarla <code>rain</code>.
    </p>

    {% if retrain %}
    <div class="form-check mt-3">
        <input class="form-check-input" type="checkbox" id="confirm-retrain" data-confirm-check />
        <label class="form-check-label" for="confirm-retrain">
            Entiendo que el modelo y las métricas actuales se reemplazarán.
        </label>
    </div>
    {% endif %}

    <button class="btn {{ 'btn-danger' if retrain else 'btn-primary btn-lg' }} w-100 mt-4" type="submit"
        {% if retrain %}disabled{% endif %}>
        <i class="bi {{ 'bi-arrow-repeat' if retrain else 'bi-play-fill' }} me-1" aria-hidden="true"></i>
        {{ 'Reentrenar y reemplazar modelo' if retrain else 'Entrenar y ver resultados' }}
    </button>
    <p class="visually-hidden" data-loading-status aria-live="polite"></p>
</form>
